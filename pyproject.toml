[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fed-ai-inventory-explorer"
version = "0.1.0"
description = "Analysis, text models and a static dashboard for the U.S. Federal AI Use Case Inventory, plus a proposal-vs-solicitation compliance checker"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fedai = "inventory.cli:main"

[tool.setuptools]
packages = ["inventory"]
